# Render blueprint for Sabacos
# Docs: https://render.com/docs/blueprint-spec
#
# Creates three services from the repo root (monorepo):
#   - sabacos-server   : Hono API + grammY bot (web service, runtime: node)
#   - sabacos-web      : Telegram Mini App (static site, runtime: static)
#   - sabacos-admin    : Admin dashboard (static site, runtime: static)

services:
  # ---------------------------------------------------------------------------
  # API + bot
  # ---------------------------------------------------------------------------
  - type: web
    name: sabacos-server
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @sabacos/server
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BOT_TOKEN
        sync: false
      - key: CHAPA_PROVIDER_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Full public URL of this service: https://sabacos-server.onrender.com
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_CHANNEL_ID
        sync: false
      # Cloudflare Workers AI (optional; ads/notifications fall back to templates without them)
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Cloudflare R2 image storage (optional; falls back to Supabase Storage)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false
      - key: MARKETING_SWEEP
        sync: false
      # Public URLs of the two static sites, e.g. https://sabacos-web.onrender.com
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_DASHBOARD_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Telegram Mini App (frontend)
  # ---------------------------------------------------------------------------
  - type: web
    name: sabacos-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @sabacos/web
    staticPublishPath: apps/sabacos-web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Set to https://sabacos-server.onrender.com/api/v1 after the server deploys,
      # then Redeploy (build-time env, inlined by Vite).
      - key: VITE_API_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Admin dashboard
  # ---------------------------------------------------------------------------
  - type: web
    name: sabacos-admin
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @sabacos/admin
    staticPublishPath: apps/sabacos-admin/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
